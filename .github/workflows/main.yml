name: Promote Candidate Docker image

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Tag to assign"
        required: true
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull candidate image
        run: |
          docker pull ghcr.io/${{ github.repository }}:candidate

      - name: Promote image
        run: |
          docker tag \
            ghcr.io/${{ github.repository }}:candidate \
            ghcr.io/${{ github.repository }}:${{ inputs.target_tag }}

          docker push \
            ghcr.io/${{ github.repository }}:${{ inputs.target_tag }}
