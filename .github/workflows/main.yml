name: Promote Docker image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Commit SHA of the image to promote"
        required: true
      target_tag:
        description: "Tag to assign"
        required: true
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull verified image
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ inputs.source_sha }}

      - name: Tag image
        run: |
          docker tag \
            ghcr.io/${{ github.repository }}:${{ inputs.source_sha }} \
            ghcr.io/${{ github.repository }}:${{ inputs.target_tag }}

      - name: Push promoted tag
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ inputs.target_tag }}
