name: Promote Docker image

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Tag to assign"
        required: true
        type: choice
        options:
          - latest
          - staging
          - prod

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull candidate image
        run: |
          docker pull "ghcr.io/${{ github.repository }}:candidate"

      - name: Promote image
        env:
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          docker tag \
            "ghcr.io/${{ github.repository }}:candidate" \
            "ghcr.io/${{ github.repository }}:${TARGET_TAG}"

          docker push \
            "ghcr.io/${{ github.repository }}:${TARGET_TAG}"
