name: Promote Docker image

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Tag to assign"
        required: true
        type: choice
        options:
          - latest
          - staging
          - prod

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull candidate image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          docker pull "${IMAGE_NAME}:candidate"

      - name: Promote image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          docker tag \
            "${IMAGE_NAME}:candidate" \
            "${IMAGE_NAME}:${TARGET_TAG}"

          docker push "${IMAGE_NAME}:${TARGET_TAG}"
